<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemon Quiz</title>
  <style>
    body{
      margin:0;
      padding:24px;
      font-family:Arial,sans-serif;
      background:#f2f7ff;
    }
    .quiz{
      max-width:700px;
      margin:0 auto;
      background:#fff;
      border:2px solid #dbe7ff;
      border-radius:12px;
      padding:20px;
    }
    h1{margin-top:0;color:#3f51b5;}
    .question{font-size:20px;margin:12px 0;}
    .answers button{
      display:block;
      width:100%;
      margin:8px 0;
      padding:10px;
      border:1px solid #ccc;
      border-radius:8px;
      background:#fafafa;
      cursor:pointer;
    }
    .answers button:hover{background:#eef4ff;}
    #nextBtn{
      margin-top:10px;
      padding:10px 14px;
      border:0;
      border-radius:8px;
      background:#3f51b5;
      color:#fff;
      cursor:pointer;
      display:none;
    }
  </style>
</head>
<body>
  <div class="quiz">
    <h1>Pokemon Quiz</h1>
    <div id="question" class="question"></div>
    <div id="answers" class="answers"></div>
    <p id="meta"></p>
    <button id="nextBtn">Next</button>
  </div>

  <script>
    const quizData = [
      { q:"What type is Pikachu?", options:["Fire","Electric","Water","Grass"], correct:1 },
      { q:"Who is #001 in the Pokedex?", options:["Bulbasaur","Charmander","Squirtle","Pikachu"], correct:0 },
      { q:"What does Eevee evolve into with a Water Stone?", options:["Jolteon","Vaporeon","Flareon","Espeon"], correct:1 }
    ];

    let current = 0;
    let score = 0;
    let locked = false;

    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const metaEl = document.getElementById("meta");
    const nextBtn = document.getElementById("nextBtn");

    function renderQuestion(){
      locked = false;
      nextBtn.style.display = "none";
      const item = quizData[current];
      questionEl.textContent = item.q;
      answersEl.innerHTML = "";
      metaEl.textContent = "Question " + (current + 1) + "/" + quizData.length + " | Score: " + score;

      item.options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.textContent = opt;
        b.onclick = function(){ chooseAnswer(i); };
        answersEl.appendChild(b);
      });
    }

    function chooseAnswer(i){
      if(locked) return;
      locked = true;
      const item = quizData[current];
      const buttons = answersEl.querySelectorAll("button");

      buttons.forEach((b, idx) => {
        if(idx === item.correct) b.style.background = "#c8f7c5";
        if(idx === i && idx !== item.correct) b.style.background = "#ffd0d0";
        b.disabled = true;
      });

      if(i === item.correct) score++;
      metaEl.textContent = "Question " + (current + 1) + "/" + quizData.length + " | Score: " + score;
      nextBtn.style.display = "inline-block";
    }

    nextBtn.onclick = function(){
      current++;
      if(current < quizData.length){
        renderQuestion();
      } else {
        questionEl.textContent = "Done! Final Score: " + score + "/" + quizData.length;
        answersEl.innerHTML = "";
        metaEl.textContent = "";
        nextBtn.style.display = "none";
      }
    };

    renderQuestion();
  </script>
</body>
</html>
