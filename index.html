<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Center</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --card:#111827cc;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --accent1:#7c3aed;
      --accent2:#06b6d4;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:Inter,system-ui,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #33415566, transparent 60%),
        radial-gradient(900px 500px at 110% 10%, #0ea5e966, transparent 55%),
        linear-gradient(160deg,var(--bg1),var(--bg2));
      padding:24px;
    }

    .card{
      width:min(760px,100%);
      background:var(--card);
      border:1px solid #334155;
      border-radius:20px;
      padding:28px;
      box-shadow:0 20px 50px #00000055;
      backdrop-filter: blur(6px);
      text-align:center;
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(1.8rem,3vw,2.4rem);
      letter-spacing:.3px;
    }

    p{
      margin:0 0 24px;
      color:var(--muted);
      font-size:1rem;
    }

    .quiz-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:14px 22px;
      border-radius:14px;
      text-decoration:none;
      font-weight:800;
      font-size:1rem;
      color:white;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      border:1px solid #ffffff33;
      box-shadow:0 10px 25px #06b6d455, inset 0 1px 0 #ffffff44;
      transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
    }

    .quiz-btn:hover{
      transform:translateY(-2px) scale(1.01);
      box-shadow:0 14px 30px #06b6d466, inset 0 1px 0 #ffffff66;
      filter:saturate(1.1);
    }

    .quiz-btn:active{
      transform:translateY(0) scale(.99);
    }

    .emoji{
      font-size:1.1em;
      line-height:1;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎮 Game Center</h1>
    <p>Choose a game to start playing.</p>

    <a class="quiz-btn" href="./pokemon-quiz.html">
      <span class="emoji">⚡</span>
      <span>Play Pokémon Quiz</span>
    </a>
  </main>
</body>
</html>
