<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Eeveelution Game Center</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial, sans-serif;
      background: linear-gradient(135deg, #ffe082 0%, #81d4fa 45%, #b39ddb 100%);
      padding:24px;
      text-align:center;
    }

    .card{
      width:100%;
      max-width:720px;
      background:rgba(255,255,255,0.96);
      border:4px solid #ffca28;
      border-radius:18px;
      padding:28px;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
    }

    h1{
      margin:0 0 10px;
      color:#4a148c;
    }

    p{
      margin:0 0 24px;
      color:#263238;
      font-size:18px;
    }

    .quiz-btn{
      display:inline-block;
      padding:14px 22px;
      border-radius:12px;
      background:linear-gradient(135deg,#7c4dff,#29b6f6);
      color:#fff;
      text-decoration:none;
      font-weight:700;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
      transition:transform .15s ease, box-shadow .2s ease;
    }

    .quiz-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 24px rgba(0,0,0,.22);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to The Eeveelution Game Center</h1>
    <p>Pick a game:</p>

    <a class="quiz-btn" href="./pokemon-quiz.html">⚡ Play Pokemon Quiz</a>
  </main>
</body>
</html>
