<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Art Creator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffd1dc;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #b03060;
      margin-bottom: 10px;
    }

    p {
      color: #6d214f;
      margin-top: 0;
    }

    .top-buttons {
      margin: 15px 0 20px;
    }

    .top-buttons a,
    .top-buttons button {
      display: inline-block;
      margin: 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #ff6fa1;
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .top-buttons a:hover,
    .top-buttons button:hover {
      background: #ff4f8b;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(16, 24px);
      grid-template-rows: repeat(16, 24px);
      gap: 1px;
      justify-content: center;
      margin: 0 auto 20px;
      width: max-content;
      background: #e0e0e0;
      padding: 6px;
      border-radius: 10px;
    }

    .cell {
      width: 24px;
      height: 24px;
      background: #fff;
      border: 1px solid #ddd;
      cursor: pointer;
    }

    .controls {
      margin-top: 10px;
    }

    .controls input[type="color"] {
      width: 48px;
      height: 36px;
      border: none;
      background: none;
      cursor: pointer;
      vertical-align: middle;
    }

    .controls button {
      margin: 0 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #7c4dff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .controls button:hover {
      background: #6937f0;
    }
  </style>
</head>
<body>
  <h1>🌈 Pixel Art Creator</h1>
  <p>Create your own pixel art!</p>

  <div class="top-buttons">
    <a href="./index.html">← Back to Game Center</a>
    <a href="#" id="eeveeBtn">Play Eeveelution Game</a>
  </div>

  <div id="grid"></div>

  <div class="controls">
    <label for="colorPicker"><strong>Color:</strong></label>
    <input type="color" id="colorPicker" value="#000000" />
    <button id="clearBtn" type="button">Clear</button>
  </div>

  <script>
    // ---- Pixel art logic ----
    const grid = document.getElementById("grid");
    const colorPicker = document.getElementById("colorPicker");
    const clearBtn = document.getElementById("clearBtn");

    const size = 16;
    let isDrawing = false;

    function createGrid() {
      for (let i = 0; i < size * size; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        cell.addEventListener("mousedown", () => {
          isDrawing = true;
          cell.style.backgroundColor = colorPicker.value;
        });

        cell.addEventListener("mouseover", () => {
          if (isDrawing) cell.style.backgroundColor = colorPicker.value;
        });

        grid.appendChild(cell);
      }
    }

    document.addEventListener("mouseup", () => {
      isDrawing = false;
    });

    clearBtn.addEventListener("click", () => {
      document.querySelectorAll(".cell").forEach(cell => {
        cell.style.backgroundColor = "#ffffff";
      });
    });

    createGrid();

    // ---- Eeveelution button fallback logic ----
    // Put your real file name first in this list if different.
    const possibleFiles = [
      "./eeveelution.html",
      "./the-eeveelution-game-center.html",
      "./The-eeveelution-game-center.html",
      "./eeveelution-game.html",
      "./eevee.html"
    ];

    document.getElementById("eeveeBtn").addEventListener("click", async function (e) {
      e.preventDefault();

      for (const file of possibleFiles) {
        try {
          const res = await fetch(file, { method: "HEAD" });
          if (res.ok) {
            window.location.href = file;
            return;
          }
        } catch (_) {}
      }

      alert("Eeveelution game file not found yet. Tell me your exact filename and I’ll wire it perfectly.");
    });
  </script>
</body>
</html>
